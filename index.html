<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Atención Monticello</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }

    .panel {
      max-width: 420px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 { color: #222; font-size: 27px; }
    p { color: #555; line-height: 1.5; }

    .maquina {
      font-size: 30px;
      font-weight: bold;
      color: #168b42;
      margin: 18px 0 8px;
      min-height: 36px;
    }

    .ayuda { font-size: 14px; color: #666; }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .tecla {
      background: #edf1f4;
      color: #222;
      border: 1px solid #dce2e7;
      border-radius: 10px;
      padding: 16px 8px;
      min-height: 58px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .tecla-secundaria {
      font-size: 14px;
      background: #e2e8ec;
    }

    .principal {
      background: #168b42;
      color: white;
      border: 0;
      padding: 16px 20px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }

    .principal:disabled {
      background: #a8b5ad;
      cursor: not-allowed;
    }

    .secundario {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #168b42;
      border-radius: 8px;
      background: white;
      color: #168b42;
      font-weight: bold;
      cursor: pointer;
    }

    .estado {
      font-size: 14px;
      min-height: 20px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .correcto { color: #168b42; }

    #copiarMensaje { display: none; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>
    <p>Ingresa el número de la máquina para solicitar ayuda.</p>

    <div class="maquina" id="numeroMostrado">_____</div>
    <div class="ayuda">Máquinas 60101 al 61608</div>

    <div class="teclado" aria-label="Teclado numérico">
      <button type="button" class="tecla" data-num="1">1</button>
      <button type="button" class="tecla" data-num="2">2</button>
      <button type="button" class="tecla" data-num="3">3</button>
      <button type="button" class="tecla" data-num="4">4</button>
      <button type="button" class="tecla" data-num="5">5</button>
      <button type="button" class="tecla" data-num="6">6</button>
      <button type="button" class="tecla" data-num="7">7</button>
      <button type="button" class="tecla" data-num="8">8</button>
      <button type="button" class="tecla" data-num="9">9</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarTodo">Borrar</button>
      <button type="button" class="tecla" data-num="0">0</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarUno">⌫</button>
    </div>

    <button type="button" class="principal" id="abrirChat" disabled>
      Solicitar asistencia
    </button>

    <div class="estado" id="estado" role="status" aria-live="polite"></div>

    <button type="button" class="secundario" id="copiarMensaje">
      Copiar mensaje de asistencia
    </button>

    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    window.Tawk_API = window.Tawk_API || {};

    const MIN_MAQUINA = 60101;
    const MAX_MAQUINA = 61608;

    const parametros = new URLSearchParams(location.search);
    const maquinaQR = parametros.get("maquina");

    const numeroMostrado = document.getElementById("numeroMostrado");
    const estado = document.getElementById("estado");
    const boton = document.getElementById("abrirChat");
    const botonCopiar = document.getElementById("copiarMensaje");

    let numero = "";
    let chatCargado = false;

    function esValido(valor) {
      const n = Number(valor);
      return /^\d{5}$/.test(valor) &&
        n >= MIN_MAQUINA && n <= MAX_MAQUINA;
    }

    function actualizarPantalla() {
      numeroMostrado.textContent = numero || "_____";
      boton.disabled = !esValido(numero);
    }

    function mostrarEstado(texto, tipo = "") {
      estado.textContent = texto;
      estado.className = "estado " + tipo;
    }

    function obtenerMensaje() {
      return "Hola, necesito ayuda con la máquina " + numero + ".";
    }

    function registrarMaquina(maquina) {
      return new Promise(function(resolve) {
        if (typeof window.Tawk_API.setAttributes !== "function") {
          console.warn("setAttributes no está disponible todavía.");
          resolve(false);
          return;
        }

        window.Tawk_API.setAttributes(
          { maquina: String(maquina) },
          function(error) {
            if (error) {
              console.error("Error registrando máquina:", error);
              resolve(false);
            } else {
              console.log("Máquina registrada:", maquina);
              resolve(true);
            }
          }
        );
      });
    }

    function prepararMensaje(maquina) {
      const mensaje =
        "Hola, necesito ayuda con la máquina " + maquina + ".";

      if (typeof window.Tawk_API.maximize === "function") {
        window.Tawk_API.maximize();
      }

      if (typeof window.Tawk_API.setChatInputMessage !== "function") {
        mostrarEstado(
          "Abre el chat y escribe: " + mensaje,
          "error"
        );
        botonCopiar.style.display = "block";
        return;
      }

      window.Tawk_API.setChatInputMessage(
        mensaje,
        function(error) {
          if (error) {
            console.error("Tawk.to no aceptó el mensaje:", error);
            mostrarEstado(
              "No se pudo insertar automáticamente. Copia el mensaje y pégalo en el chat.",
              "error"
            );
            botonCopiar.style.display = "block";
          } else {
            mostrarEstado(
              "Mensaje preparado para la máquina " + maquina +
              ". Revísalo y pulsa Enviar.",
              "correcto"
            );
            botonCopiar.style.display = "none";
          }
        }
      );
    }

    document.querySelectorAll("[data-num]").forEach(function(tecla) {
      tecla.addEventListener("click", function() {
        if (numero.length >= 5) return;

        numero += tecla.dataset.num;
        mostrarEstado("");
        actualizarPantalla();
      });
    });

    document.getElementById("borrarTodo").addEventListener("click", function() {
      numero = "";
      mostrarEstado("");
      botonCopiar.style.display = "none";
      actualizarPantalla();
    });

    document.getElementById("borrarUno").addEventListener("click", function() {
      numero = numero.slice(0, -1);
      mostrarEstado("");
      actualizarPantalla();
    });

    botonCopiar.addEventListener("click", async function() {
      const mensaje = obtenerMensaje();

      try {
        await navigator.clipboard.writeText(mensaje);
        mostrarEstado("Mensaje copiado. Pégalo en el chat.", "correcto");
      } catch (error) {
        mostrarEstado("Copia este mensaje: " + mensaje, "error");
      }
    });

    boton.addEventListener("click", async function() {
      if (!esValido(numero)) return;

      const maquina = String(numero);

      if (!chatCargado) {
        mostrarEstado(
          "El chat todavía está cargando. Espera unos segundos e inténtalo de nuevo.",
          "error"
        );
        return;
      }

      boton.disabled = true;
      mostrarEstado("Registrando la máquina " + maquina + "…");

      await registrarMaquina(maquina);

      // Se usa el número seleccionado en el momento del clic.
      prepararMensaje(maquina);

      boton.disabled = false;
    });

    if (maquinaQR && esValido(maquinaQR)) {
      numero = maquinaQR;
    }

    actualizarPantalla();

    // El evento se define antes de cargar el script de Tawk.to.
    window.Tawk_API.onLoad = function() {
      chatCargado = true;
      console.log("Tawk.to cargado correctamente.");

      const parametrosActuales = new URLSearchParams(location.search);
      const maquina = parametrosActuales.get("maquina");

      if (maquina && esValido(maquina)) {
        registrarMaquina(maquina);
      }
    };
  </script>

  <!-- Código oficial del widget de Tawk.to -->
  <script type="text/javascript">
    var Tawk_LoadStart = new Date();

    (function() {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src = "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5ii42l2";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
</body>
</html>
