<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atención Monticello</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }
    .panel {
      max-width: 420px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }
    h1 { color: #222; }
    p { color: #555; line-height: 1.5; }
    .maquina {
      font-size: 24px;
      font-weight: bold;
      color: #168b42;
      margin: 12px 0 18px;
    }
    .pantalla {
      width: 100%;
      box-sizing: border-box;
      font-size: 26px;
      text-align: center;
      padding: 14px;
      margin: 8px 0 14px;
      border: 2px solid #d5dbe0;
      border-radius: 8px;
      letter-spacing: 2px;
    }
    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      background: #168b42;
      color: white;
      border: 0;
      padding: 15px 10px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tecla {
      background: #e8edf0;
      color: #222;
      font-weight: bold;
      min-height: 52px;
    }
    .secundario {
      background: #687782;
      font-size: 15px;
    }
    #abrirChat { width: 100%; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #80b5ff;
      outline-offset: 2px;
    }
    #estado { min-height: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Atención Monticello</h1>
    <p>Ingresa el número de la máquina donde necesitas ayuda.</p>

    <p>Máquina seleccionada:</p>
    <div class="maquina" id="maquina">No identificada</div>

    <input
      class="pantalla"
      id="numeroMaquina"
      type="text"
      inputmode="none"
      pattern="[0-9]*"
      maxlength="5"
      placeholder="N.º de máquina"
      aria-label="Número de máquina"
      readonly
    >

    <div class="teclado" aria-label="Teclado numérico">
      <button type="button" class="tecla" data-num="1">1</button>
      <button type="button" class="tecla" data-num="2">2</button>
      <button type="button" class="tecla" data-num="3">3</button>
      <button type="button" class="tecla" data-num="4">4</button>
      <button type="button" class="tecla" data-num="5">5</button>
      <button type="button" class="tecla" data-num="6">6</button>
      <button type="button" class="tecla" data-num="7">7</button>
      <button type="button" class="tecla" data-num="8">8</button>
      <button type="button" class="tecla" data-num="9">9</button>
      <button type="button" class="secundario" id="borrar">Borrar</button>
      <button type="button" class="tecla" data-num="0">0</button>
      <button type="button" class="secundario" id="corregir">⌫</button>
    </div>

    <p id="estado" role="status" aria-live="polite"></p>
    <button type="button" id="abrirChat">Solicitar asistencia</button>
    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <!-- Cargar el chat de Tawk.to -->
  <script>
    var Tawk_API = window.Tawk_API || {};
    var Tawk_LoadStart = new Date();

    (function () {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5iqq6dv";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");
      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const maquinaQR = parametros.get("maquina");
    const campo = document.getElementById("numeroMaquina");
    const etiqueta = document.getElementById("maquina");
    const estado = document.getElementById("estado");
    const botonChat = document.getElementById("abrirChat");

    let numero = "";

    // Si se llega desde el QR de una máquina válida, precargarla.
    if (maquinaQR && /^\d{5}$/.test(maquinaQR) &&
        Number(maquinaQR) >= 10001 && Number(maquinaQR) <= 11800) {
      numero = maquinaQR;
    }

    function actualizarPantalla() {
      campo.value = numero;
      etiqueta.textContent = numero || "No identificada";
      estado.textContent = "";
    }

    document.querySelectorAll("[data-num]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        if (numero.length < 5) {
          numero += boton.dataset.num;
          actualizarPantalla();
        }
      });
    });

    document.getElementById("borrar").addEventListener("click", function () {
      numero = "";
      actualizarPantalla();
    });

    document.getElementById("corregir").addEventListener("click", function () {
      numero = numero.slice(0, -1);
      actualizarPantalla();
    });

    actualizarPantalla();

    botonChat.addEventListener("click", function () {
      if (!/^\d{5}$/.test(numero) ||
          Number(numero) < 10001 || Number(numero) > 11800) {
        estado.textContent = "Ingresa un número válido entre 10001 y 11800.";
        return;
      }

      etiqueta.textContent = numero;
      estado.textContent = "Abriendo el chat de asistencia…";

      // Registrar el identificador en Tawk.to antes de abrir el chat.
      if (window.Tawk_API &&
          typeof window.Tawk_API.setAttributes === "function") {
        window.Tawk_API.setAttributes({ "maquina": numero }, function (error) {
          if (error) {
            console.error("No se pudo registrar la máquina:", error);
          }
        });
      }

      if (window.Tawk_API &&
          typeof window.Tawk_API.maximize === "function") {
        window.Tawk_API.maximize();
      } else {
        estado.textContent =
          "El chat todavía está cargando. Espera unos segundos y vuelve a intentarlo.";
      }
    });

    // Registrar el número también cuando termine de cargar el widget.
    window.Tawk_API = window.Tawk_API || {};
    window.Tawk_API.onLoad = function () {
      if (numero && typeof window.Tawk_API.setAttributes === "function") {
        window.Tawk_API.setAttributes({ "maquina": numero }, function (error) {
          if (error) {
            console.error("No se pudo registrar la máquina:", error);
          }
        });
      }
    };
  </script>
</body>
</html>
