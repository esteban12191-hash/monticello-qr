<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atención Monticello</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }

    .panel {
      max-width: 420px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 { color: #222; font-size: 27px; }
    p { color: #555; line-height: 1.5; }

    .maquina {
      font-size: 30px;
      font-weight: bold;
      color: #168b42;
      margin: 18px 0 8px;
      overflow-wrap: anywhere;
    }

    .ayuda {
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .tecla {
      background: #edf1f4;
      color: #222;
      border: 1px solid #dce2e7;
      border-radius: 10px;
      padding: 16px 8px;
      min-height: 58px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .tecla-secundaria {
      font-size: 14px;
      background: #e2e8ec;
    }

    .principal {
      background: #168b42;
      color: white;
      border: 0;
      padding: 16px 20px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }

    .principal:disabled {
      background: #a8b5ad;
      cursor: not-allowed;
    }

    .estado {
      font-size: 14px;
      min-height: 20px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .correcto { color: #168b42; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>
    <p>Ingresa el número de la máquina para solicitar ayuda.</p>

    <div class="maquina" id="numeroMostrado">_____</div>
    <div class="ayuda">Máquinas 60101 al 61608</div>

    <div class="teclado">
      <button type="button" class="tecla" data-num="1">1</button>
      <button type="button" class="tecla" data-num="2">2</button>
      <button type="button" class="tecla" data-num="3">3</button>
      <button type="button" class="tecla" data-num="4">4</button>
      <button type="button" class="tecla" data-num="5">5</button>
      <button type="button" class="tecla" data-num="6">6</button>
      <button type="button" class="tecla" data-num="7">7</button>
      <button type="button" class="tecla" data-num="8">8</button>
      <button type="button" class="tecla" data-num="9">9</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarTodo">Borrar</button>
      <button type="button" class="tecla" data-num="0">0</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarUno">⌫</button>
    </div>

    <button type="button" class="principal" id="abrirChat" disabled>
      Solicitar asistencia
    </button>

    <div class="estado" id="estado" role="status" aria-live="polite"></div>
    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    const MIN_MAQUINA = 60101;
    const MAX_MAQUINA = 61608;

    const parametros = new URLSearchParams(location.search);
    const maquinaQR = parametros.get("maquina");

    let numero = "";
    let chatCargado = false;
    let procesando = false;

    const numeroMostrado = document.getElementById("numeroMostrado");
    const estado = document.getElementById("estado");
    const boton = document.getElementById("abrirChat");

    // Preparar la API ANTES de cargar el widget.
    window.Tawk_API = window.Tawk_API || {};

    function esValido(valor) {
      const n = Number(valor);
      return /^\d{5}$/.test(valor) &&
             n >= MIN_MAQUINA &&
             n <= MAX_MAQUINA;
    }

    function actualizarPantalla() {
      numeroMostrado.textContent = numero || "_____";
      boton.disabled = !esValido(numero) || procesando;
    }

    function mostrarEstado(texto, tipo) {
      estado.textContent = texto;
      estado.className = "estado " + (tipo || "");
    }

    function actualizarAtributo(callback) {
      if (!chatCargado ||
          typeof window.Tawk_API.setAttributes !== "function") {
        callback(new Error("El chat todavía no está listo."));
        return;
      }

      // Se toma el número ACTUAL, no el del primer QR.
      const maquinaSeleccionada = numero;

      window.Tawk_API.setAttributes(
        { maquina: maquinaSeleccionada },
        function(error) {
          if (error) {
            callback(error);
          } else {
            callback(null, maquinaSeleccionada);
          }
        }
      );
    }

    document.querySelectorAll("[data-num]").forEach(function(tecla) {
      tecla.addEventListener("click", function() {
        if (procesando || numero.length >= 5) return;

        numero += tecla.dataset.num;
        mostrarEstado("", "");
        actualizarPantalla();
      });
    });

    document.getElementById("borrarTodo").addEventListener("click", function() {
      if (procesando) return;
      numero = "";
      mostrarEstado("", "");
      actualizarPantalla();
    });

    document.getElementById("borrarUno").addEventListener("click", function() {
      if (procesando) return;
      numero = numero.slice(0, -1);
      mostrarEstado("", "");
      actualizarPantalla();
    });

    boton.addEventListener("click", function() {
      if (!esValido(numero) || procesando) return;

      procesando = true;
      actualizarPantalla();

      // Guardar el número exacto confirmado por el cliente.
      const numeroConfirmado = numero;

      actualizarAtributo(function(error, maquinaGuardada) {
        if (error) {
          console.error("Error al actualizar atributo:", error);
          procesando = false;
          actualizarPantalla();
          mostrarEstado(
            "No se pudo registrar la máquina. Intenta nuevamente.",
            "error"
          );
          return;
        }

        const mensaje =
          "Hola, necesito ayuda con la máquina " +
          maquinaGuardada + ".";

        if (typeof window.Tawk_API.maximize === "function") {
          window.Tawk_API.maximize();
        }

        if (typeof window.Tawk_API.setChatInputMessage === "function") {
          window.Tawk_API.setChatInputMessage(
            mensaje,
            function(errorMensaje) {
              procesando = false;
              actualizarPantalla();

              if (errorMensaje) {
                console.error("Error al preparar mensaje:", errorMensaje);
                mostrarEstado(
                  "Máquina " + maquinaGuardada +
                  " registrada. Escribe este mensaje en el chat: " +
                  mensaje,
                  "correcto"
                );
              } else {
                mostrarEstado(
                  "Máquina " + maquinaGuardada +
                  " registrada. Revisa el chat y pulsa Enviar.",
                  "correcto"
                );
              }
            }
          );
        } else {
          procesando = false;
          actualizarPantalla();
          mostrarEstado(
            "Máquina " + maquinaGuardada +
            " registrada. Escribe en el chat: " + mensaje,
            "correcto"
          );
        }
      });
    });

    // El QR propone el número inicial, pero se puede cambiar.
    if (maquinaQR && esValido(maquinaQR)) {
      numero = maquinaQR;
    }

    actualizarPantalla();

    window.Tawk_API.onLoad = function() {
      chatCargado = true;
      console.log("Chat Tawk.to cargado.");
    };
  </script>

  <!-- Tawk.to: mantener el mismo identificador del chat -->
  <script type="text/javascript">
    var Tawk_LoadStart = new Date();

    (function() {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src =
        "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5iqq6dv";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
</body>
</html>
