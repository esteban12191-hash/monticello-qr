<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Atención Monticello</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      text-align: center;

      padding: 30px 16px;

      background: #f4f6f8;

    }

    .panel {

      max-width: 420px;

      margin: auto;

      padding: 24px;

      background: white;

      border-radius: 16px;

    }

    button {

      padding: 14px 20px;

      background: #176b55;

      color: white;

      border: 0;

      border-radius: 8px;

      font-size: 16px;

    }

  </style>

</head>

<body>

  <div class="panel">

    <h1>Atención Monticello</h1>

    <p>Solicitud de asistencia para:</p>

    <h2 id="maquina">Leyendo máquina...</h2>

    <p>Presiona el botón para abrir el chat de atención.</p>

    <button onclick="abrirChat()">Solicitar ayuda</button>

    <p id="estado"></p>

  </div>

  <script>

    const params = new URLSearchParams(location.search);

    const maquina = params.get("maquina") || "NO IDENTIFICADA";

    document.getElementById("maquina").textContent = maquina;

    function abrirChat() {

      const chat = "https://tawk.to/chat/6ada66eb3ac893a346526b3c/1k5i14212";

      const destino = chat + "?maquina=" + encodeURIComponent(maquina);

      window.open(destino, "_blank");

    }

  </script>

</body>

</html>
