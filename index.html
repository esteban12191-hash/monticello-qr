<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Atención Monticello</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }

    .panel {
      max-width: 420px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 { color: #222; font-size: 27px; }
    p { color: #555; line-height: 1.5; }

    .maquina {
      font-size: 30px;
      font-weight: bold;
      color: #168b42;
      margin: 18px 0 8px;
      min-height: 36px;
    }

    .ayuda { font-size: 14px; color: #666; }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .tecla {
      background: #edf1f4;
      color: #222;
      border: 1px solid #dce2e7;
      border-radius: 10px;
      padding: 16px 8px;
      min-height: 58px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .tecla-secundaria {
      font-size: 14px;
      background: #e2e8ec;
    }

    .principal {
      background: #168b42;
      color: white;
      border: 0;
      padding: 16px 20px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }

    .principal:disabled {
      background: #a8b5ad;
      cursor: not-allowed;
    }

    .estado {
      font-size: 14px;
      min-height: 20px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .correcto { color: #168b42; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>
    <p>Ingresa el número de la máquina para solicitar ayuda.</p>

    <div class="maquina" id="numeroMostrado">_____</div>
    <div class="ayuda">Máquinas 60101 al 61608</div>

    <div class="teclado">
      <button type="button" class="tecla" data-num="1">1</button>
      <button type="button" class="tecla" data-num="2">2</button>
      <button type="button" class="tecla" data-num="3">3</button>
      <button type="button" class="tecla" data-num="4">4</button>
      <button type="button" class="tecla" data-num="5">5</button>
      <button type="button" class="tecla" data-num="6">6</button>
      <button type="button" class="tecla" data-num="7">7</button>
      <button type="button" class="tecla" data-num="8">8</button>
      <button type="button" class="tecla" data-num="9">9</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarTodo">Borrar</button>
      <button type="button" class="tecla" data-num="0">0</button>
      <button type="button" class="tecla tecla-secundaria" id="borrarUno">⌫</button>
    </div>

    <button type="button" class="principal" id="abrirChat" disabled>
      Solicitar asistencia
    </button>

    <div class="estado" id="estado" role="status" aria-live="polite"></div>
    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    window.Tawk_API = window.Tawk_API || {};

    const MIN_MAQUINA = 60101;
    const MAX_MAQUINA = 61608;

    const parametros = new URLSearchParams(location.search);
    const maquinaQR = parametros.get("maquina");

    const numeroMostrado = document.getElementById("numeroMostrado");
    const estado = document.getElementById("estado");
    const boton = document.getElementById("abrirChat");

    let numero = "";
    let chatCargado = false;
    let procesando = false;
    let cierreSolicitado = false;

    function esValido(valor) {
      const n = Number(valor);
      return /^\d{5}$/.test(valor) &&
             n >= MIN_MAQUINA &&
             n <= MAX_MAQUINA;
    }

    function actualizarPantalla() {
      numeroMostrado.textContent = numero || "_____";
      boton.disabled = !esValido(numero) || procesando;
    }

    function mostrarEstado(texto, tipo = "") {
      estado.textContent = texto;
      estado.className = "estado " + tipo;
    }

    function terminar(texto, tipo = "") {
      mostrarEstado(texto, tipo);
      procesando = false;
      actualizarPantalla();
    }

    function registrarMaquina(maquina, callback) {
      if (typeof window.Tawk_API.setAttributes !== "function") {
        callback(false);
        return;
      }

      window.Tawk_API.setAttributes(
        { maquina: String(maquina) },
        function(error) {
          if (error) {
            console.error("Error al registrar máquina:", error);
            callback(false);
          } else {
            console.log("Máquina registrada:", maquina);
            callback(true);
          }
        }
      );
    }

    function prepararChat(maquina) {
      const mensaje =
        "Hola, necesito ayuda con la máquina " + maquina + ".";

      if (typeof window.Tawk_API.maximize === "function") {
        window.Tawk_API.maximize();
      }

      if (typeof window.Tawk_API.setChatInputMessage !== "function") {
        terminar(
          "El chat está abierto. Escribe: " + mensaje,
          "error"
        );
        return;
      }

      window.Tawk_API.setChatInputMessage(
        mensaje,
        function(error) {
          if (error) {
            terminar(
              "Escribe en el chat: " + mensaje,
              "error"
            );
          } else {
            terminar(
              "Mensaje preparado. Revísalo y pulsa Enviar.",
              "correcto"
            );
          }
        }
      );
    }

    document.querySelectorAll("[data-num]").forEach(function(tecla) {
      tecla.addEventListener("click", function() {
        if (procesando || numero.length >= 5) return;

        numero += tecla.dataset.num;
        mostrarEstado("");
        actualizarPantalla();
      });
    });

    document.getElementById("borrarTodo").addEventListener("click", function() {
      if (procesando) return;
      numero = "";
      mostrarEstado("");
      actualizarPantalla();
    });

    document.getElementById("borrarUno").addEventListener("click", function() {
      if (procesando) return;
      numero = numero.slice(0, -1);
      mostrarEstado("");
      actualizarPantalla();
    });

    boton.addEventListener("click", function() {
      if (!esValido(numero) || procesando) return;

      if (!chatCargado) {
        mostrarEstado("El chat está cargando. Inténtalo nuevamente.", "error");
        return;
      }

      procesando = true;
      actualizarPantalla();

      const maquina = numero;

      registrarMaquina(maquina, function(registrada) {
        if (!registrada) {
          console.warn("No se confirmó el registro de la máquina.");
        }

        prepararChat(maquina);
      });
    });

    if (maquinaQR && esValido(maquinaQR)) {
      numero = maquinaQR;
    }

    actualizarPantalla();

    /*
      Los eventos se definen antes de cargar el script de Tawk.to.
    */

    window.Tawk_API.onLoad = function() {
      chatCargado = true;
      console.log("Chat de Tawk.to cargado.");

      if (maquinaQR && esValido(maquinaQR)) {
        registrarMaquina(maquinaQR, function(registrada) {
          console.log(
            registrada
              ? "QR asociado a máquina " + maquinaQR
              : "No se pudo asociar la máquina del QR."
          );
        });
      }
    };

    window.Tawk_API.onChatStarted = function() {
      cierreSolicitado = false;
      console.log("Conversación iniciada.");
    };

    window.Tawk_API.onChatMessageVisitor = function(data) {
      console.log("Evento de mensaje del visitante:", data);

      /*
        Se contemplan varias formas posibles del dato recibido.
        Si Tawk no entrega el texto aquí, no se puede confirmar
        que el mensaje contenga el número de máquina.
      */
      let texto = "";

      if (typeof data === "string") {
        texto = data;
      } else if (data && typeof data.message === "string") {
        texto = data.message;
      } else if (data && typeof data.text === "string") {
        texto = data.text;
      } else if (
        data && data.message &&
        typeof data.message.text === "string"
      ) {
        texto = data.message.text;
      }

      const coincidencias = texto.match(/\b\d{5}\b/g) || [];
      const maquinaEncontrada =
        coincidencias.find(function(n) { return esValido(n); });

      if (!maquinaEncontrada || cierreSolicitado) return;

      cierreSolicitado = true;
      console.log("Mensaje de asistencia detectado:", maquinaEncontrada);

      setTimeout(function() {
        if (typeof window.Tawk_API.endChat === "function") {
          window.Tawk_API.endChat();
          console.log("Se solicitó finalizar el chat.");
        } else {
          console.warn("La función endChat no está disponible.");
          cierreSolicitado = false;
        }
      }, 1500);
    };

    window.Tawk_API.onChatEnded = function() {
      cierreSolicitado = false;
      console.log("Conversación finalizada.");
    };
  </script>

  <!-- Este código carga el widget integrado en la página QR. -->
  <script type="text/javascript">
    var Tawk_LoadStart = new Date();

    (function() {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src =
        "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5iqq6dv";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
</body>
</html>
