<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Casino Monticello</title>
</head>
<body>
  <p>Conectando con asistencia...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const maquina = params.get("maquina");

    const minimo = 60101;
    const maximo = 61608;

    if (
      maquina &&
      /^\d+$/.test(maquina) &&
      Number(maquina) >= minimo &&
      Number(maquina) <= maximo
    ) {
      const destino = new URL(
        "https://monticello-machine-muse.lovable.app/"
      );

      destino.searchParams.set("maquina", maquina);

      window.location.replace(destino.toString());
    } else {
      document.body.innerHTML =
        "<h2>Máquina no identificada</h2>" +
        "<p>Escanea nuevamente el código QR de la máquina.</p>";
    }
  </script>
</body>
</html>
