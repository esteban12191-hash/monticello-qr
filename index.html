<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Atención Monticello</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      color: #222;
    }

    .panel {
      max-width: 420px;
      margin: 30px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .maquina {
      margin: 24px 0 8px;
      font-size: 34px;
      font-weight: bold;
      color: #168b42;
    }

    .etiqueta {
      font-size: 14px;
      color: #666;
    }

    .principal {
      width: 100%;
      margin-top: 24px;
      padding: 17px 12px;
      background: #168b42;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .principal:disabled {
      background: #a8b5ad;
      cursor: wait;
    }

    .estado {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .correcto { color: #168b42; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>

    <p>
      ¿Tu máquina presenta algún problema?
      Solicita ayuda a nuestro equipo.
    </p>

    <div class="etiqueta">Número de máquina</div>
    <div class="maquina" id="numeroMaquina">Cargando...</div>

    <button
      type="button"
      class="principal"
      id="solicitar"
      disabled
    >
      Solicitar asistencia
    </button>

    <div
      class="estado"
      id="estado"
      role="status"
      aria-live="polite"
    ></div>

    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    // Configuración de la máquina desde el QR.
    const MIN_MAQUINA = 60101;
    const MAX_MAQUINA = 61608;

    const parametros = new URLSearchParams(location.search);
    const maquina = parametros.get("maquina");

    const numeroMaquina = document.getElementById("numeroMaquina");
    const boton = document.getElementById("solicitar");
    const estado = document.getElementById("estado");

    let tawkListo = false;
    let procesando = false;

    function esValida(valor) {
      const n = Number(valor);
      return /^\d{5}$/.test(valor || "") &&
        n >= MIN_MAQUINA &&
        n <= MAX_MAQUINA;
    }

    function mostrarEstado(mensaje, tipo = "") {
      estado.textContent = mensaje;
      estado.className = "estado " + tipo;
    }

    if (esValida(maquina)) {
      numeroMaquina.textContent = maquina;
      boton.disabled = false;
    } else {
      numeroMaquina.textContent = "No identificado";
      mostrarEstado(
        "Este QR no contiene un número de máquina válido. Solicita ayuda al personal.",
        "error"
      );
    }

    // Esperar a que Tawk.to esté disponible.
    window.Tawk_API = window.Tawk_API || {};

    window.Tawk_API.onLoad = function() {
      tawkListo = true;
      console.log("Widget de Tawk.to cargado.");

      if (esValida(maquina) &&
          typeof window.Tawk_API.setAttributes === "function") {
        window.Tawk_API.setAttributes(
          { maquina: String(maquina) },
          function(error) {
            if (error) {
              console.error("No se pudo registrar la máquina:", error);
            } else {
              console.log("Máquina registrada:", maquina);
            }
          }
        );
      }
    };

    boton.addEventListener("click", function() {
      if (!esValida(maquina) || procesando) return;

      if (!tawkListo) {
        mostrarEstado(
          "El chat todavía está cargando. Espera unos segundos e inténtalo nuevamente.",
          "error"
        );
        return;
      }

      procesando = true;
      boton.disabled = true;

      const mensaje =
        "Hola, necesito ayuda con la máquina " + maquina + ".";

      // Registrar nuevamente la máquina justo antes de solicitar ayuda.
      function abrirChat() {
        if (typeof window.Tawk_API.maximize === "function") {
          window.Tawk_API.maximize();
        }

        if (typeof window.Tawk_API.setChatInputMessage === "function") {
          window.Tawk_API.setChatInputMessage(
            mensaje,
            function(error) {
              if (error) {
                mostrarEstado(
                  "El chat está abierto, pero no se pudo insertar el mensaje. Escribe: " + mensaje,
                  "error"
                );
              } else {
                mostrarEstado(
                  "Mensaje preparado para la máquina " + maquina +
                  ". Revísalo y pulsa Enviar.",
                  "correcto"
                );
              }

              procesando = false;
              boton.disabled = false;
            }
          );
        } else {
          mostrarEstado(
            "Abre el chat y escribe: " + mensaje,
            "error"
          );

          procesando = false;
          boton.disabled = false;
        }
      }

      if (typeof window.Tawk_API.setAttributes === "function") {
        window.Tawk_API.setAttributes(
          { maquina: String(maquina) },
          function(error) {
            if (error) {
              console.warn("No se confirmó el atributo de máquina.");
            }
            abrirChat();
          }
        );
      } else {
        abrirChat();
      }
    });
  </script>

  <!-- Código oficial del widget de Tawk.to -->
  <script type="text/javascript">
    var Tawk_LoadStart = new Date();

    (function() {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src =
        "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5ii42l2";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
</body>
</html>
