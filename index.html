<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atención Monticello</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 24px 16px;
      margin: 0;
    }
    .panel {
      max-width: 360px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }
    h1 { color: #222; }
    p { color: #555; line-height: 1.5; }
    #numero {
      box-sizing: border-box;
      width: 100%;
      font-size: 30px;
      text-align: center;
      padding: 15px;
      margin: 10px 0 16px;
      border: 2px solid #d5dbe0;
      border-radius: 8px;
      letter-spacing: 3px;
    }
    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 16px 8px;
      font-size: 18px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tecla {
      background: #e8edf0;
      color: #222;
      min-height: 52px;
      font-weight: bold;
    }
    .secundario { background: #687782; color: white; }
    #enviar {
      background: #168b42;
      color: white;
      width: 100%;
      font-weight: bold;
    }
    #estado { min-height: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Atención Monticello</h1>
    <p>Ingresa el número de la máquina donde necesitas ayuda.</p>

    <input id="numero" value="" readonly aria-label="Número de máquina"
      placeholder="N.º de máquina">

    <div class="teclado">
      <button type="button" class="tecla" data-num="1">1</button>
      <button type="button" class="tecla" data-num="2">2</button>
      <button type="button" class="tecla" data-num="3">3</button>
      <button type="button" class="tecla" data-num="4">4</button>
      <button type="button" class="tecla" data-num="5">5</button>
      <button type="button" class="tecla" data-num="6">6</button>
      <button type="button" class="tecla" data-num="7">7</button>
      <button type="button" class="tecla" data-num="8">8</button>
      <button type="button" class="tecla" data-num="9">9</button>
      <button type="button" class="secundario" id="borrar">Borrar</button>
      <button type="button" class="tecla" data-num="0">0</button>
      <button type="button" class="secundario" id="retroceso">⌫</button>
    </div>

    <p id="estado" role="status" aria-live="polite"></p>
    <button type="button" id="enviar">Solicitar asistencia</button>
    <p>Se abrirá el chat para enviar tu solicitud.</p>
  </main>

  <script>
    var Tawk_API = window.Tawk_API || {};
    var Tawk_LoadStart = new Date();

    (function () {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5iqq6dv";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");
      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>

  <script>
    const campo = document.getElementById("numero");
    const estado = document.getElementById("estado");
    let numero = "";

    document.querySelectorAll("[data-num]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        if (numero.length < 5) {
          numero += boton.dataset.num;
          campo.value = numero;
          estado.textContent = "";
        }
      });
    });

    document.getElementById("borrar").addEventListener("click", function () {
      numero = "";
      campo.value = "";
      estado.textContent = "";
    });

    document.getElementById("retroceso").addEventListener("click", function () {
      numero = numero.slice(0, -1);
      campo.value = numero;
      estado.textContent = "";
    });

    document.getElementById("enviar").addEventListener("click", function () {
      if (!/^\d{5}$/.test(numero) ||
          Number(numero) < 10001 || Number(numero) > 11800) {
        estado.textContent = "Ingresa un número entre 10001 y 11800.";
        return;
      }

      estado.textContent = "Abriendo el chat…";

      if (typeof Tawk_API.setAttributes === "function") {
        Tawk_API.setAttributes({ maquina: numero }, function (error) {
          if (error) console.error(error);
        });
      }

      if (typeof Tawk_API.setChatInputMessage === "function") {
        Tawk_API.setChatInputMessage(
          "Solicitud de asistencia para la máquina " + numero + ".",
          function (error) {
            if (error) console.error(error);
          }
        );
      }

      if (typeof Tawk_API.maximize === "function") {
        Tawk_API.maximize();
        estado.textContent =
          "Revisa el chat y pulsa Enviar para confirmar la solicitud.";
      } else {
        estado.textContent =
          "El chat está cargando. Espera unos segundos y vuelve a intentarlo.";
      }
    });
  </script>
</body>
</html>
