<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Atención Monticello</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      color: #222;
    }

    .panel {
      max-width: 420px;
      margin: 30px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 { font-size: 27px; margin-bottom: 10px; }
    p { color: #555; line-height: 1.5; }
    .etiqueta { font-size: 14px; color: #666; }

    .maquina {
      margin: 16px 0 8px;
      font-size: 34px;
      font-weight: bold;
      color: #168b42;
      overflow-wrap: anywhere;
    }

    .principal {
      width: 100%;
      margin-top: 24px;
      padding: 17px 12px;
      background: #168b42;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .principal:disabled {
      background: #a8b5ad;
      cursor: wait;
    }

    .secundario {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: white;
      color: #168b42;
      border: 1px solid #168b42;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .estado {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .correcto { color: #168b42; }
    #copiarMensaje { display: none; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>

    <p>
      ¿Tu máquina presenta algún problema?
      Solicita ayuda a nuestro equipo.
    </p>

    <div class="etiqueta">Número de máquina</div>
    <div class="maquina" id="numeroMaquina">Cargando...</div>

    <button type="button" class="principal" id="solicitar" disabled>
      Solicitar asistencia
    </button>

    <div class="estado" id="estado" role="status"
         aria-live="polite"></div>

    <button type="button" class="secundario" id="copiarMensaje">
      Copiar mensaje de asistencia
    </button>

    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    window.Tawk_API = window.Tawk_API || {};

    const MIN_MAQUINA = 60101;
    const MAX_MAQUINA = 61608;

    const numeroMaquina = document.getElementById("numeroMaquina");
    const boton = document.getElementById("solicitar");
    const estado = document.getElementById("estado");
    const botonCopiar = document.getElementById("copiarMensaje");

    let tawkListo = false;
    let procesando = false;

    function obtenerMaquinaQR() {
      const params = new URLSearchParams(window.location.search);
      return params.get("maquina") || "";
    }

    function esValida(valor) {
      const n = Number(valor);
      return /^\d{5}$/.test(valor) &&
        n >= MIN_MAQUINA &&
        n <= MAX_MAQUINA;
    }

    function mensajePara(maquina) {
      return "Hola, necesito ayuda con la máquina " + maquina + ".";
    }

    function mostrarEstado(texto, tipo = "") {
      estado.textContent = texto;
      estado.className = "estado " + tipo;
    }

    function actualizarPantalla() {
      const maquina = obtenerMaquinaQR();

      if (esValida(maquina)) {
        numeroMaquina.textContent = maquina;
        boton.disabled = !tawkListo || procesando;
      } else {
        numeroMaquina.textContent = "No identificado";
        boton.disabled = true;
        mostrarEstado(
          "El QR no contiene un número de máquina válido.",
          "error"
        );
      }
    }

    function registrarMaquina(maquina) {
      return new Promise(function(resolve) {
        if (typeof window.Tawk_API.setAttributes !== "function") {
          resolve(false);
          return;
        }

        window.Tawk_API.setAttributes(
          { maquina: String(maquina) },
          function(error) {
            if (error) {
              console.error("Error registrando máquina:", error);
              resolve(false);
            } else {
              console.log("Máquina registrada:", maquina);
              resolve(true);
            }
          }
        );
      });
    }

    function registrarEvento(maquina) {
      return new Promise(function(resolve) {
        if (typeof window.Tawk_API.addEvent !== "function") {
          resolve(false);
          return;
        }

        window.Tawk_API.addEvent(
          "solicitud-asistencia",
          {
            maquina: String(maquina),
            mensaje: mensajePara(maquina)
          },
          function(error) {
            if (error) {
              console.error("Error registrando evento:", error);
              resolve(false);
            } else {
              console.log("Evento registrado para máquina:", maquina);
              resolve(true);
            }
          }
        );
      });
    }

    async function copiarTexto(texto) {
      try {
        await navigator.clipboard.writeText(texto);
        mostrarEstado(
          "Mensaje copiado. Pégalo en el chat y pulsa Enviar.",
          "correcto"
        );
      } catch (error) {
        mostrarEstado("Copia este mensaje: " + texto, "error");
      }
    }

    botonCopiar.addEventListener("click", function() {
      const maquina = obtenerMaquinaQR();
      if (!esValida(maquina)) return;
      copiarTexto(mensajePara(maquina));
    });

    boton.addEventListener("click", async function() {
      const maquina = obtenerMaquinaQR();

      if (!esValida(maquina) || procesando || !tawkListo) {
        actualizarPantalla();
        return;
      }

      procesando = true;
      actualizarPantalla();
      botonCopiar.style.display = "block";

      mostrarEstado("Registrando solicitud para máquina " + maquina + "…");

      try {
        const registrada = await registrarMaquina(maquina);
        const eventoRegistrado = await registrarEvento(maquina);

        if (typeof window.Tawk_API.maximize === "function") {
          window.Tawk_API.maximize();
        }

        if (registrada && eventoRegistrado) {
          mostrarEstado(
            "Solicitud registrada para la máquina " + maquina +
            ". Continúa en el chat para recibir ayuda.",
            "correcto"
          );
          botonCopiar.style.display = "none";
        } else {
          mostrarEstado(
            "Chat abierto. Si necesitas identificar la máquina en el mensaje, " +
            "pulsa Copiar mensaje de asistencia.",
            "error"
          );
        }
      } catch (error) {
        console.error("Error en solicitud de asistencia:", error);

        if (typeof window.Tawk_API.maximize === "function") {
          window.Tawk_API.maximize();
        }

        mostrarEstado(
          "Chat abierto. Puedes copiar el mensaje y pegarlo en el chat.",
          "error"
        );
      } finally {
        procesando = false;
        actualizarPantalla();
      }
    });

    // Definir el evento antes de cargar el widget.
    window.Tawk_API.onLoad = function() {
      tawkListo = true;

      const maquina = obtenerMaquinaQR();

      if (esValida(maquina)) {
        registrarMaquina(maquina);
      }

      actualizarPantalla();
    };

    actualizarPantalla();
  </script>

  <!-- Widget oficial de Tawk.to -->
  <script type="text/javascript">
    var Tawk_LoadStart = new Date();

    (function() {
      var s1 = document.createElement("script");
      var s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src = "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5ii42l2";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>
</body>
</html>
