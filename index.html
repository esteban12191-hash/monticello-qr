<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Atención Monticello</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      color: #222;
    }

    .panel {
      max-width: 420px;
      margin: 30px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .etiqueta {
      font-size: 14px;
      color: #666;
    }

    .maquina {
      margin: 16px 0;
      font-size: 36px;
      font-weight: bold;
      color: #168b42;
      overflow-wrap: anywhere;
    }

    .principal,
    .secundario {
      width: 100%;
      padding: 16px 12px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .principal {
      margin-top: 12px;
      color: white;
      background: #168b42;
      border: none;
    }

    .principal:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secundario {
      margin-top: 12px;
      color: #168b42;
      background: white;
      border: 1px solid #168b42;
    }

    .estado {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .correcto {
      color: #168b42;
    }

    .error {
      color: #b42318;
    }

    #copiarMensaje {
      display: none;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Atención Monticello</h1>

    <p>
      ¿Tu máquina presenta algún problema?
      Solicita ayuda a nuestro equipo.
    </p>

    <div class="etiqueta">Número de máquina</div>
    <div id="numeroMaquina" class="maquina">Cargando...</div>

    <button id="solicitar" class="principal" type="button" disabled>
      Conectando al chat...
    </button>

    <div id="estado" class="estado" role="status" aria-live="polite"></div>

    <button id="copiarMensaje" class="secundario" type="button">
      Copiar mensaje de asistencia
    </button>

    <p>Un trabajador atenderá tu solicitud por chat.</p>
  </main>

  <script>
    (function () {
      "use strict";

      const MIN_MAQUINA = 60101;
      const MAX_MAQUINA = 61608;

      const numeroElemento = document.getElementById("numeroMaquina");
      const boton = document.getElementById("solicitar");
      const estado = document.getElementById("estado");
      const botonCopiar = document.getElementById("copiarMensaje");

      let tawkListo = false;
      let procesando = false;

      // Leer el número desde la dirección del QR.
      function obtenerMaquina() {
        const params = new URLSearchParams(location.search);
        const numero = params.get("maquina") || "";

        if (!/^\d{5}$/.test(numero)) return "";

        const valor = Number(numero);

        if (valor < MIN_MAQUINA || valor > MAX_MAQUINA) {
          return "";
        }

        return numero;
      }

      const maquina = obtenerMaquina();

      function crearMensaje() {
        return "Hola, necesito ayuda con la máquina " +
          maquina + ".";
      }

      function mostrarEstado(texto, tipo) {
        estado.textContent = texto;
        estado.className = "estado " + (tipo || "");
      }

      // Mostrar la máquina inmediatamente, sin esperar a Tawk.to.
      function inicializarPantalla() {
        if (!maquina) {
          numeroElemento.textContent = "No identificado";
          boton.disabled = true;
          boton.textContent = "QR no válido";

          mostrarEstado(
            "No se encontró un número de máquina válido en este QR.",
            "error"
          );

          return;
        }

        numeroElemento.textContent = maquina;
        boton.textContent = "Solicitar asistencia";
        boton.disabled = !tawkListo || procesando;
      }

      function actualizarBoton() {
        boton.disabled = !maquina || !tawkListo || procesando;
      }

      // Actualizar el atributo de la máquina en Tawk.to.
      function actualizarAtributo() {
        return new Promise(function (resolve) {
          const api = window.Tawk_API;

          if (typeof api.setAttributes !== "function") {
            resolve(false);
            return;
          }

          api.setAttributes(
            { maquina: String(maquina) },
            function (error) {
              if (error) {
                console.error("Error al actualizar máquina:", error);
                resolve(false);
              } else {
                resolve(true);
              }
            }
          );
        });
      }

      // Registrar la solicitud como evento.
      function registrarSolicitud() {
        return new Promise(function (resolve) {
          const api = window.Tawk_API;

          if (typeof api.addEvent !== "function") {
            resolve(false);
            return;
          }

          api.addEvent(
            "solicitud-asistencia",
            {
              maquina: String(maquina),
              mensaje: crearMensaje()
            },
            function (error) {
              if (error) {
                console.error("Error al registrar solicitud:", error);
                resolve(false);
              } else {
                resolve(true);
              }
            }
          );
        });
      }

      // Intentar rellenar el cuadro de mensaje de Tawk.to.
      function intentarEscribirMensaje() {
        return new Promise(function (resolve) {
          const api = window.Tawk_API;

          if (typeof api.setChatInputMessage !== "function") {
            resolve(false);
            return;
          }

          api.setChatInputMessage(
            crearMensaje(),
            function (error) {
              if (error) {
                console.error("Tawk.to no aceptó el mensaje:", error);
                resolve(false);
              } else {
                resolve(true);
              }
            }
          );
        });
      }

      async function copiarMensaje() {
        const texto = crearMensaje();

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(texto);

            mostrarEstado(
              "Mensaje copiado. Pégalo en el chat y pulsa Enviar.",
              "correcto"
            );
          } else {
            mostrarEstado("Copia este mensaje: " + texto, "error");
          }
        } catch (error) {
          mostrarEstado("Copia este mensaje: " + texto, "error");
        }
      }

      botonCopiar.addEventListener("click", copiarMensaje);

      boton.addEventListener("click", async function () {
        if (!maquina || !tawkListo || procesando) return;

        procesando = true;
        actualizarBoton();

        botonCopiar.style.display = "block";

        mostrarEstado(
          "Preparando asistencia para la máquina " + maquina + "..."
        );

        try {
          // Primero se actualiza la máquina y se registra la solicitud.
          const atributoOK = await actualizarAtributo();
          const eventoOK = await registrarSolicitud();

          // Abrir el chat.
          if (typeof window.Tawk_API.maximize === "function") {
            window.Tawk_API.maximize();
          }

          // Dar tiempo al chat para abrirse antes de insertar el texto.
          await new Promise(function (resolve) {
            setTimeout(resolve, 900);
          });

          let mensajeOK = await intentarEscribirMensaje();

          // Un segundo intento por si el cuadro todavía no estaba listo.
          if (!mensajeOK) {
            await new Promise(function (resolve) {
              setTimeout(resolve, 1200);
            });

            mensajeOK = await intentarEscribirMensaje();
          }

          if (mensajeOK) {
            mostrarEstado(
              "Mensaje preparado para la máquina " + maquina +
              ". Revisa el chat y pulsa Enviar.",
              "correcto"
            );

            botonCopiar.style.display = "none";
          } else {
            mostrarEstado(
              "El chat está abierto, pero Tawk.to no permitió escribir " +
              "el mensaje automáticamente. Usa Copiar mensaje de asistencia.",
              "error"
            );
          }

          console.log("Máquina:", maquina);
          console.log("Atributo actualizado:", atributoOK);
          console.log("Evento registrado:", eventoOK);
          console.log("Mensaje preparado:", mensajeOK);

        } catch (error) {
          console.error("Error de asistencia:", error);

          if (typeof window.Tawk_API.maximize === "function") {
            window.Tawk_API.maximize();
          }

          mostrarEstado(
            "Chat abierto. Si no aparece el mensaje, pulsa Copiar mensaje de asistencia.",
            "error"
          );

          botonCopiar.style.display = "block";
        } finally {
          procesando = false;
          actualizarBoton();
        }
      });

      // Esta función debe definirse antes de cargar el widget.
      window.Tawk_API = window.Tawk_API || {};

      window.Tawk_API.onLoad = function () {
        tawkListo = true;
        actualizarBoton();

        // Actualizar el atributo también al cargar el chat.
        if (maquina) {
          actualizarAtributo();
        }
      };

      inicializarPantalla();

      // Cargar el widget oficial de Tawk.to.
      const script = document.createElement("script");

      script.async = true;
      script.src =
        "https://embed.tawk.to/6ada66eb3ac89a346526b3ec/1k5ii42l2";
      script.charset = "UTF-8";
      script.setAttribute("crossorigin", "*");

      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
